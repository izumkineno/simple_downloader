[package]
name = "simple_downloader"
version = "0.7.1"
edition = "2024"
rust-version = "1.85"
description = "高性能异步下载器：动态并发、断点续传、多源/代理 lane 调度，基于 Tokio + reqwest"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/izumkineno/simple_downloader"
homepage = "https://github.com/izumkineno/simple_downloader"
documentation = "https://docs.rs/simple_downloader"
keywords = ["download", "async", "tokio", "resume", "multi-source"]
categories = ["network-programming", "asynchronous"]
[features]
default = []
resume = ["dep:bitcode"]
multi-source = []
proxy = ["multi-source"]
progress = []
rate-limit = ["dep:governor"]
queue = ["dep:uuid"]

[dependencies]
tokio = { version = "1.52.0", features = [
    "rt-multi-thread", # 启用多线程运行时，支持 tokio::spawn
    "macros",          # 启用宏，主要是为了 tokio::select!
    "fs",              # 启用异步文件系统操作，如 tokio::fs
    "io-util",         # 启用 I/O 工具 trait，如 AsyncWriteExt
    "signal",          # 启用信号/控制事件，用于进程级中断测试
] }
reqwest = { version = "0.13.2", features = ["stream"] }
futures-util = "0.3.32"
bytes = "1.11.1"
thiserror = "2.0.18"
faststr = "0.2.34"
bitcode = { version = "0.6.9", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
governor = { version = "0.7", optional = true }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"], optional = true }
[dev-dependencies]
indicatif = "0.18.4"
mockito = "1.5.0"
tempfile = "3.13.0"
assert2 = "0.4.0"

[[example]]
name = "with_custom_ui"
required-features = ["progress", "resume"]

[[example]]
name = "test_server_smart_schedule"
required-features = ["progress"]

[[example]]
name = "manual_multi_source_test_server"
required-features = ["multi-source", "progress"]

[[example]]
name = "resume_harness"
required-features = ["resume", "multi-source"]

[[example]]
name = "with_rate_limit"
required-features = ["rate-limit", "progress"]

[[example]]
name = "with_queue"
required-features = ["queue"]

[[test]]
name = "queue"
required-features = ["queue"]
